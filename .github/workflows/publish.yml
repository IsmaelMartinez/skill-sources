name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

# Authentication is OIDC only: npmjs.com has a trusted publisher configured
# against this repo and this workflow filename, so npm exchanges the Actions
# OIDC token for a short-lived one and no npm token secret exists.
#
# Renaming this file breaks publishing until the trusted publisher is updated
# to match, because the filename is part of what npm matches on. A new package
# cannot be published this way at all — trusted publishing cannot create one,
# so a first publish still needs a temporary granular token (npm/cli#8544).
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Full history: the test suite uses this repo's own log as a fixture
      # and hangs against a shallow checkout (see test.yml).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1+. Node 24 bundles npm 11, so the
      # global npm upgrade this step used to do is no longer needed; dropping
      # back below Node 24 would reintroduce it.
      # No lifecycle scripts. This job holds id-token: write, so a postinstall
      # anywhere in the dev tree could mint an npm publish credential for this
      # package and ship a tarball carrying a genuine provenance attestation.
      # Nothing here needs install scripts; the suite passes without them.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm publish --provenance --access public
