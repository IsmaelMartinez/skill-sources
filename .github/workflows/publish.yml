name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # npm publish --provenance attests the build via the Actions OIDC token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Full history: the test suite uses this repo's own log as a fixture
      # and hangs against a shallow checkout (see test.yml).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
