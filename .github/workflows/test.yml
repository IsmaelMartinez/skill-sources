name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # package.json declares node >=20, so the floor is tested alongside the
      # current LTS. Drop 20 here only when that engines range moves too.
      matrix:
        node-version: [20, 24]
    steps:
      # The cli tests use this repository's own history as a git-upstream
      # fixture; a shallow checkout makes the resolver's local clone hang
      # (git's --filter fallback loops against a shallow source) and would
      # seed the shallow boundary commit rather than the real one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
